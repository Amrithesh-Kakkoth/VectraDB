[package]
name = "vectradb-server"
version = "0.1.0"
edition = "2021"
description = "Production-grade vector database server in Rust"
license = "MIT"
repository = "https://github.com/Amrithesh-Kakkoth/VectraDB"
homepage = "https://github.com/Amrithesh-Kakkoth/VectraDB"
documentation = "https://github.com/Amrithesh-Kakkoth/VectraDB#readme"
include = ["src/**", "proto/**", "Cargo.toml", "build.rs", "README.md"]

[features]
default = []
gpu = ["vectradb-search/gpu", "vectradb-storage/gpu", "vectradb-api/gpu"]

[[bin]]
name = "vectradb-server"
path = "src/main.rs"

[dependencies]
vectradb-api = { path = "../api" }
vectradb-storage = { path = "../storage" }
vectradb-search = { path = "../search" }
vectradb-components = { path = "../components" }
vectradb-embeddings = { path = "../embeddings" }
vectradb-tfidf = { path = "../tfidf" }
vectradb-rag = { path = "../rag" }
ndarray = { workspace = true }
clap = { workspace = true }
env_logger = { workspace = true }
tokio = { workspace = true }
tonic = { workspace = true }
prost = { workspace = true }
axum = { workspace = true }
axum-server = { version = "0.7", features = ["tls-rustls"] }
tokio-rustls = "0.26"
rustls-pemfile = "2"

[build-dependencies]
tonic-build = { workspace = true }





